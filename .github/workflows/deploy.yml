name: Build & push image to Yandex Cloud

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate yc with service account key
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: b1g74qv3u70jmct1ekvf
        run: |
          echo "$YC_SA_JSON" > /tmp/sa-key.json
          yc config profile create github
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id "$YC_FOLDER_ID"
          yc container registry configure-docker

      - name: Build and push image
        env:
          REGISTRY_ID: crpp5mnmgd6ru4hap79f
        run: |
          IMAGE=cr.yandex/$REGISTRY_ID/domofon
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy new container revision
        env:
          CONTAINER_ID: bbam40spnjv4cplmmjlv
          SA_ID: ajej3pko57a1lan1erl1
          REGISTRY_ID: crpp5mnmgd6ru4hap79f
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_PEER_ID: ${{ secrets.VK_PEER_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          IMAGE=cr.yandex/$REGISTRY_ID/domofon:latest
          yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" \
            --image "$IMAGE" \
            --cores 1 \
            --core-fraction 20 \
            --memory 512MB \
            --service-account-id "$SA_ID" \
            --execution-timeout 60s \
            --environment "VK_GROUP_TOKEN=$VK_GROUP_TOKEN,VK_PEER_ID=$VK_PEER_ID,ADMIN_PASSWORD=$ADMIN_PASSWORD,YDB_DATABASE_PATH=/ru-central1/b1gpj9488h3k7oaa3foh/etn1ah45qvisdme7mftg,YDB_DOCUMENT_API_ENDPOINT=https://docapi.serverless.yandexcloud.net/ru-central1/b1gpj9488h3k7oaa3foh/etn1ah45qvisdme7mftg"